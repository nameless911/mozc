name: CI for Windows
# https://github.com/google/mozc/blob/master/docs/build_mozc_in_windows.md
#
# Fork-specific: only the x64 installer is built, and the Qt build output and
# the Bazel disk cache are kept in actions/cache so that rebuilds after small
# changes are faster.

# Run on push.
on: push

permissions:
  contents: read

# Prevent previous workflows from running.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build_on_x64:
    # https://github.com/actions/runner-images/blob/main/images/windows/Windows2025-Readme.md
    runs-on: windows-2025
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: Try to restore update_deps cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: src/third_party_cache
          key: update_deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/build_tools/update_deps.py') }}

      - name: Install Dependencies
        shell: cmd
        working-directory: .\src
        # This command uses src/third_party_cache as the download cache.
        run: |
          python build_tools/update_deps.py

      # The Qt build output only depends on the Qt version and build options,
      # which are defined in these scripts.
      - name: Try to restore Qt build cache
        id: qt_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            src/third_party/qt
            src/third_party/qt_host
          key: qt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/build_tools/build_qt.py', 'src/build_tools/update_deps.py') }}

      - name: Build Qt
        if: steps.qt_cache.outputs.cache-hit != 'true'
        shell: cmd
        working-directory: .\src
        run: |
          python build_tools/build_qt.py --release --confirm_license

      # This is needed only for GitHub Actions where free disk space is quite limited.
      - name: Delete Qt src to save disk space
        shell: cmd
        working-directory: .\src
        run: |
          if exist third_party\qt_src rmdir third_party\qt_src /s /q

      # Each run saves a new entry; restore-keys picks up the latest one.
      - name: Try to restore Bazel disk cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/bazel_disk_cache
          key: bazel-disk-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            bazel-disk-${{ runner.os }}-${{ runner.arch }}-

      # Raise the build number on every run so that the installer replaces the
      # files of a previously installed build (files with the same version are
      # not overwritten by Windows Installer).
      - name: Bump build number
        shell: pwsh
        working-directory: .\src
        run: |
          $path = 'version.bzl'
          $text = Get-Content $path -Raw
          $new = $text -replace '(?m)^BUILD = BUILD_OSS\s*$', "BUILD = BUILD_OSS + $env:GITHUB_RUN_NUMBER"
          if ($new -eq $text) { throw 'BUILD line not found in version.bzl' }
          Set-Content $path $new -NoNewline
          Select-String -Path $path -Pattern '^BUILD'

      - name: build artifacts
        shell: cmd
        working-directory: .\src
        env:
          ANDROID_NDK_HOME: ""
        run: |
          bazelisk build package --config release_build --disk_cache=${{ runner.temp }}/bazel_disk_cache --experimental_disk_cache_gc_max_size=4G

      - name: upload Mozc64_x64.msi
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: Mozc64_x64.msi
          path: src/bazel-bin/win32/installer/Mozc64.msi
          if-no-files-found: warn
